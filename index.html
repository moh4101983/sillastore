  <style>
    :root {
      --bg: #07152f;
      --gold: #c8a96b;
      --gold-light: #e5d0a0;
      --text: #f7f3ea;
      --muted: #aaa69d;
      --wa: #25D366;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;

      color: var(--text);

      font-family:
        "Noto Sans Arabic",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          ellipse at 50% 43%,
          rgba(200,169,107,.12),
          transparent 48%
        ),
        radial-gradient(
          ellipse at 50% 0%,
          rgba(24,66,125,.28),
          transparent 55%
        ),
        linear-gradient(
          180deg,
          #0b1d3d 0%,
          #07152f 55%,
          #040d1e 100%
        );
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;
      z-index: 0;

      opacity: .035;

      background-image:
        radial-gradient(#fff .5px, transparent .5px);

      background-size: 5px 5px;
    }

    .page {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 720px;

      min-height: 100vh;
      min-height: 100svh;

      margin: 0 auto;

      padding:
        max(30px, env(safe-area-inset-top))
        22px
        calc(112px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
    }

    .brand {
      text-align: center;
      padding-top: 12px;
    }

    .brand-name {
      margin: 0;

      color: var(--text);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(34px, 9vw, 51px);
      font-weight: 500;
      letter-spacing: .16em;
    }

    .brand-line {
      width: 54px;
      height: 1px;

      margin: 13px auto 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
    }

    .brand-subtitle {
      margin: 11px 0 0;

      color: var(--gold-light);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 10px;
      letter-spacing: .32em;
    }

    .hero {
      flex: 1;

      min-height: 60vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 35px 0 30px;
    }

    .eyebrow {
      margin: 0 0 13px;

      color: var(--gold);

      font-size: 10px;
      letter-spacing: .12em;
    }

    .title {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(25px, 7vw, 37px);
      line-height: 1.55;
      font-weight: 400;
    }

    .title span {
      color: var(--gold-light);
    }

    .whatsapp-center {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 124px;
      height: 124px;

      flex-shrink: 0;

      margin-top: 29px;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,.28);

      background:
        linear-gradient(
          145deg,
          #36e879 0%,
          #25D366 55%,
          #19b957 100%
        );

      box-shadow:
        inset 0 2px 3px rgba(255,255,255,.25),
        0 0 0 7px rgba(37,211,102,.055),
        0 0 0 14px rgba(37,211,102,.025),
        0 18px 38px rgba(0,0,0,.45),
        0 7px 22px rgba(37,211,102,.18);

      text-decoration: none;

      transform: translateY(-2px);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .whatsapp-center::after {
      content: "";

      position: absolute;
      inset: 8px;

      border: 1px solid rgba(255,255,255,.22);

      border-radius: 50%;

      pointer-events: none;
    }

    .whatsapp-center:active {
      transform: translateY(1px) scale(.97);
    }

    .whatsapp-icon {
      width: 65px;
      height: 65px;

      fill: #fff;

      position: relative;
      z-index: 1;
    }

    .cta-label {
      margin-top: 19px;

      color: var(--text);

      font-size: 14px;
      font-weight: 500;
    }

    .cta-label::after {
      content: "";

      display: block;

      width: 32px;
      height: 1px;

      margin: 9px auto 0;

      background: var(--gold);

      opacity: .7;
    }

    .footer {
      padding-top: 15px;

      text-align: center;
    }

    .footer-text {
      margin: 0;

      color: #77736a;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 10px;
      letter-spacing: .12em;
    }

    .bottom-cta {
      position: fixed;

      z-index: 10;

      left: 16px;
      right: 16px;

      bottom:
        calc(13px + env(safe-area-inset-bottom));

      width: auto;

      max-width: 688px;

      margin: 0 auto;
    }

    .whatsapp-bottom {
      min-height: 58px;

      width: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 11px;

      padding: 14px 20px;

      border-radius: 16px;

      border: 1px solid rgba(255,255,255,.22);

      background:
        linear-gradient(
          135deg,
          #29d96a,
          #20c961
        );

      color: #fff;

      text-decoration: none;

      font-size: 15px;
      font-weight: 700;

      box-shadow:
        0 12px 32px rgba(0,0,0,.45),
        0 5px 16px rgba(37,211,102,.15);

      transition:
        transform .2s ease;
    }

    .whatsapp-bottom:active {
      transform: scale(.985);
    }

    .bottom-icon {
      width: 26px;
      height: 26px;

      flex-shrink: 0;

      fill: white;
    }

    @media (max-height: 680px) {

      .hero {
        min-height: auto;
        padding: 25px 0;
      }

      .whatsapp-center {
        width: 108px;
        height: 108px;

        margin-top: 23px;
      }

      .whatsapp-icon {
        width: 58px;
        height: 58px;
      }

      .brand {
        padding-top: 4px;
      }

      .cta-label {
        margin-top: 16px;
      }
    }

    @media (min-width: 700px) {

      .bottom-cta {
        left: 50%;
        right: auto;

        width: calc(100% - 44px);

        transform: translateX(-50%);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- WHATSAPP + TIKTOK EVENTS -->
  <script>

    const WHATSAPP_NUMBER = "972566569109";

    const WHATSAPP_MESSAGE =
      "مرحبا، اريد المزيد من الإستفسار حول المنتج الترويجي ؟";

    const whatsappURL =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      encodeURIComponent(WHATSAPP_MESSAGE);


    const whatsappCenter =
      document.getElementById("whatsappCenter");

    const whatsappBottom =
      document.getElementById("whatsappBottom");


    whatsappCenter.href = whatsappURL;
    whatsappBottom.href = whatsappURL;


    /* TikTok Events — مرتبطة بالبكسل الجديد */

    function trackWhatsAppEvents(event) {

      if (event) {
        event.preventDefault();
      }

      /*
        InitiateCheckout
        مع Content ID الخاص بـ Sila Store
      */
      ttq.track("InitiateCheckout", {
        content_id: "SILA_STORE_WHATSAPP"
      });

      /*
        Contact
      */
      ttq.track("Contact");

      /*
        إعطاء TikTok Pixel وقتاً لإرسال الأحداث
        قبل فتح واتساب
      */
      const whatsappURL = this.href;

      setTimeout(function () {
        window.location.href = whatsappURL;
      }, 180);
    }


    whatsappCenter.addEventListener(
      "click",
      trackWhatsAppEvents,
      false
    );

    whatsappBottom.addEventListener(
      "click",
      trackWhatsAppEvents,
      false
    );

  </script>
